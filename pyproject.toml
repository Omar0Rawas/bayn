[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bayn"
version = "0.1.0"
description = "Local Muse 2 EEG -> gesture trigger -> Whisper transcript -> local LLM summary (hackathon prototype, not a medical device)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Loose ranges here; exact pins live in requirements/*.txt
dependencies = [
  "numpy>=2.2",
  "scipy>=1.14",
  "pyzmq>=26",
  "msgpack>=1.1",
  "pyyaml>=6",
  "pydantic>=2.9",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "websockets>=13",
  "brainflow>=5.12",
  "pylsl>=1.16",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
muselsl = ["muselsl>=2.2", "bleak>=0.22", "bitstring<5"]
stt = ["faster-whisper>=1.1", "sounddevice>=0.5"]
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12>=9,<10"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
bayn = "bayn.run:main"
bayn-eeg = "bayn.eeg.bridge:main"
bayn-ui = "bayn.ui.server:main"
bayn-audio = "bayn.transcription.audio:main"
bayn-stt = "bayn.transcription.service:main"
bayn-models = "bayn.transcription.models:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bayn = ["ui/static/*", "seizure/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "unit: one function/class in isolation, no I/O",
  "integration: several components together (sockets, BrainFlow synthetic board, LSL)",
  "system: whole processes end to end (bridge + dashboard), simulated EEG",
  "hardware: needs a real Muse 2 nearby; skipped unless BAYN_HARDWARE=1",
]
