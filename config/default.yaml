# Bayn default configuration.
# Override per machine with config/local.yaml (gitignored) or environment variables:
#   BAYN_<SECTION>__<KEY>=value        e.g.  BAYN_EEG__SOURCE=muse
#   nested:  BAYN_SIMULATOR__AUTO_GESTURES__ENABLED=true
# Nothing here assumes specific hardware: GPU, mains frequency, etc. are auto-detected.

eeg:
  source: muse             # muse (BrainFlow MUSE_2_BOARD) | lsl (muse-lsl fallback) | sim
                           # demo mode (--demo) always forces sim
  channels: [TP9, AF7, AF8, TP10]
  fs: 256                  # Muse 2 sample rate (Hz)
  chunk_samples: 32        # samples per published chunk (32 @ 256 Hz = 125 ms)
  bandpass_hz: [1.0, 40.0] # display / analysis band
  notch_hz: auto           # auto | 50 | 60 | off. "auto" notches both 50 and 60 Hz
                           # (both lie outside 1-40 Hz, so this costs nothing) and
                           # reports which mains frequency it actually measured.
  buffer_seconds: 60       # rolling buffer kept by the bridge
  brainflow:
    board: MUSE_2_BOARD    # any BrainFlow BoardIds name; SYNTHETIC_BOARD = no-hardware test
    serial_number: ""      # Muse name, e.g. "Muse-3EE1" (on the headset box / shown by muse-check);
                           # empty = first Muse found. Set it when several Muses are nearby.
    mac_address: ""
    timeout_s: 20          # BLE discovery timeout per connection attempt
    stale_after_s: 3       # no samples for this long = connection lost -> reconnect
  lsl:
    stream_type: EEG
    stream_name: ""        # empty = first EEG stream found
    resolve_timeout_s: 10
    autostart_muselsl: true  # run.py starts `muselsl stream` itself when source=lsl
    stale_after_s: 3

simulator:
  seed: null               # set an int for reproducible signals
  mains_hz: 50             # line noise the simulator adds (exercises the auto notch)
  natural_blinks: true     # random single blinks = realistic distractors for the detector
  natural_emg: true        # random short, weak muscle bursts (talking, swallowing)
  auto_gestures:           # scripted injections, used by demo mode
    enabled: false
    first_after_s: 15
    every_s: 45
    sequence: [clench, double_blink]

events:
  gesture: clench          # which deliberate gesture fires an event:
                           # clench | double_blink | both | manual (button/hotkey only)
  cooldown_s: 15           # ignore further gestures this long after an event
  manual_debounce_s: 2     # the button/hotkey can't fire twice within this
  pre_s: 10                # EEG saved before the event...
  post_s: 30               # ...and after it
  profile: default         # calibration profile -> data/profiles/<profile>-<source>.json
  clench:
    band_hz: [55, 100]     # jaw-muscle (EMG) band on TP9/TP10; mains + harmonics notched out
    window_s: 0.25         # RMS envelope window
    hold_s: 1.0            # must stay above threshold this long (talking/swallowing are shorter)
    threshold_uv: null     # null = calibrated value, else adaptive (baseline_k x resting level)
    baseline_k: 4.0
    min_threshold_uv: 8.0
  double_blink:
    band_hz: [0.3, 10]     # blink band on the AF7/AF8 average (low cut keeps the post-blink rebound small)
    threshold_uv: null     # null = calibrated value, else default_threshold_uv
    default_threshold_uv: 90   # on the filtered AF7/AF8 average (deliberate blinks ~120-160)
    min_gap_s: 0.2         # gap between the two blinks
    max_gap_s: 0.8
    max_width_s: 0.6       # a blink is a short peak; longer = movement artefact
    settle_s: 0.45         # wait this long after the 2nd blink to rule out a 3rd
  calibration:
    rest_s: 15
    reps: 3
    ready_s: 2
    do_s: 3
    release_s: 3
    auto_inject_sim: true  # in simulated mode the simulator performs the prompted gestures

audio:
  source: mic              # mic (live microphone, default) | file (WAV played in real time)
  device: null             # null = system default input; or part of the device name, or its index
  file: samples/audio/demo.wav
  loop: true               # file source: start over at the end
  chunk_ms: 100

transcription:
  model: auto              # auto = large-v3-turbo on an NVIDIA GPU, small on CPU
                           # or: tiny | base | small | medium | large-v3 | large-v3-turbo
  device: auto             # auto | cuda | cpu  (auto falls back to CPU if the GPU fails)
  compute_type: auto       # auto = float16 on GPU, int8 on CPU
  language: mixed          # mixed = Arabic or English, detected per utterance
                           # auto = any language | en | ar
  mixed_strategy: per_utterance  # how 'mixed' picks the language of an utterance:
                           # per_utterance = whichever of ar/en is more likely
                           # arabic_lean   = Arabic unless clearly English (keeps English words in
                           #                 Latin script inside Arabic sentences; see docs/TESTING.md)
  english_confidence: 0.9  # arabic_lean: P(en) needed to decode as English
  initial_prompt: none     # none | auto (code-switched Hejazi/English style hint) | any custom text
  beam_size: auto          # auto = 5 on GPU, 1 on CPU (faster)
  vad_threshold: 0.5       # Silero speech probability
  min_silence_s: 0.6       # pause that ends an utterance
  max_utterance_s: 15      # force a cut in long monologues
  partials: auto           # live in-progress text: auto = only on GPU | true | false
  partial_every_s: 1.0
  event_grace_s: 20        # max wait for speech still in progress when an event window closes
  event_tail_s: 4          # finish a sentence that runs past the window end (up to this long)

summary:
  model: auto              # auto = qwen2.5:7b with an NVIDIA GPU >= 10 GB (or Apple Silicon >= 16 GB),
                           # else qwen2.5:3b. Or any Ollama model; compare with `bayn eval-summary`
  host: http://127.0.0.1:11434   # local Ollama server (never a cloud endpoint)
  language: auto           # auto = main language of the transcript | en | ar | both
  temperature: 0.2
  max_key_points: 4
  keep_alive: 60m          # keep the model loaded so summaries start instantly
  timeout_s: 180

bus:
  bind_host: 127.0.0.1     # interface producers bind to
  eeg_host: 127.0.0.1      # where consumers find the EEG bridge
  eeg_pub_port: 5555       # EEG data + status (PUB)
  eeg_cmd_port: 5556       # commands to the bridge, e.g. simulator injections (PULL)
  events_host: 127.0.0.1   # where consumers find the events service
  events_pub_port: 5560    # events, trigger status, calibration (PUB)
  events_cmd_port: 5561    # manual trigger, calibration, gesture choice (PULL)
  audio_host: 127.0.0.1
  audio_pub_port: 5570     # 16 kHz mono audio + mic level (PUB)
  stt_host: 127.0.0.1
  stt_pub_port: 5575       # transcript segments, partials, status (PUB)
  stt_cmd_port: 5576       # language choice (PULL)
  sum_host: 127.0.0.1
  sum_pub_port: 5580       # summary tokens, finished summaries, status (PUB)
  sum_cmd_port: 5581       # regenerate, summary language (PULL)

ui:
  host: 127.0.0.1
  port: 8080
  plot_seconds: 5          # width of the live EEG plot
  open_browser: true

logging:
  level: INFO
